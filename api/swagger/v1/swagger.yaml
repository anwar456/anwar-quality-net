                "$ref": "#/components/schemas/Error"
  "/api/v1/assessments/{assessment_id}/sessions":
    parameters:
    - name: assessment_id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: List the sessions (candidates) of an assessment
      tags:
      - Sessions
      security:
      - bearer_auth: []
      responses:
        '200':
          description: sessions, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
