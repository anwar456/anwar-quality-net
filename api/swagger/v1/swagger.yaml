                properties:
                  session:
                    "$ref": "#/components/schemas/Session"
                  invite_url:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    candidate_name:
                      type: string
                    candidate_id:
                      type: integer
  "/api/v1/sessions/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: Get a session
      tags:
      - Sessions
      security:
      - bearer_auth: []
      responses:
        '200':
          description: session with its assessment
          content:
            application/json:
              schema:
                type: object
                required:
                - session
                properties:
                  session:
                    allOf:
                    - "$ref": "#/components/schemas/Session"
                    - type: object
                      required:
                      - assessment
                      properties:
                        assessment:
                          type: object
                          required:
                          - id
                          - name
                          - time_limit_min
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            time_limit_min:
                              type: integer
        '404':
          description: session of another tenant
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/sessions/{id}/end_session":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: End a session as the assessor
      tags:
      - Sessions
      description: 'Marks the session ended, creates the portfolio and queues its
        generation. Known gap (audit R-12): a live audio connection of the candidate
        is not closed.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: ended
          content:
            application/json:
              schema:
                type: object
                required:
                - session
                properties:
                  session:
                    "$ref": "#/components/schemas/Session"
        '422':
          description: unknown reason
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    reason:
                      type: string
                      enum:
                      - manual_assessor
                      - manual_candidate
                      - time_ceiling
                      - error
                      - all_covered
