            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Invite a candidate (create a session)
      tags:
      - Sessions
      description: 'Returns the invite link. Known defect (audit R-07): the link is
        built from `APP_BASE_URL`, which is the API host, while the interview page
        is served by the web app.'
