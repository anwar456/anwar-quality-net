                    type: string
        '404':
          description: unknown token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/sessions/{token}/audio_complete":
    parameters:
    - name: token
      in: path
      schema:
        type: string
      description: Invite token (no JWT)
      required: true
    post:
      summary: 'Candidate: the closing audio finished playing, end the session'
      tags:
      - Candidate
      description: 'No authentication and no state check: it ends a session in any
        state with `end_reason=all_covered` and queues portfolio generation (audit
        R-09).'
